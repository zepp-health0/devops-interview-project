# Deployment stack: runs a published, immutable image.
#
# Separate from the root docker-compose.yml on purpose. That file builds from the working tree,
# which is right for development and wrong for deployment: what runs here must be the exact
# artifact CI published, addressed by digest so the running container is traceable to a commit.

services:
  app:
    # Deliberately defaulted rather than guarded with ":?". Compose validates this field even for
    # `down`, so a hard guard would make tearing the stack down impossible without knowing which
    # image is running. deploy.sh validates TASK_API_IMAGE before it does anything.
    image: ${TASK_API_IMAGE:-task-api:unset}
    ports:
      - "${TASK_API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
