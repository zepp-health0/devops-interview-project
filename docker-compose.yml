# Local development and observability stack: the app built from source, Prometheus scraping it,
# and Grafana with the datasource and dashboard already provisioned.
#
# For deploying a published, immutable image see deploy/docker-compose.deploy.yml.

services:
  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        REVISION: ${REVISION:-unknown}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    # No healthcheck block: the image already declares one, and repeating it here would let the
    # two definitions drift apart.

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.3.0
    ports:
      - "3000:3000"
    environment:
      # Local-only demo credentials. Nothing here is a real secret; the deployed stack does not
      # publish Grafana at all.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous viewing so the dashboard can be opened from a clean checkout without a login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
