apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    # Pinned uid: the dashboard JSON references this exact value, so the datasource resolves on a
    # clean start instead of the dashboard loading with an empty datasource picker.
    uid: prometheus
    jsonData:
      timeInterval: 5s
